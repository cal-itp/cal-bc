name: Terraform Apply

on:
  push:
    branches:
      - 'main'
    paths:
      - 'bin/**'
      - 'iac/**'
      - 'src/**'
      - '.dockerignore'
      - '.gcloudignore'
      - '.github/workflows/terraform-apply.yml'
      - '.github/workflows/terraform-plan.yml'
      - '.python-version'
      - 'Dockerfile'
      - 'main.py'
      - 'manage.py'
      - 'pyproject.toml'
      - 'uv.lock'

env:
  SERVICE_ACCOUNT: 'github-actions-service-account@cal-itp-data-infra-staging.iam.gserviceaccount.com'
  WORKLOAD_IDENTITY_PROVIDER: 'projects/473674835135/locations/global/workloadIdentityPools/github-actions/providers/cal-bc'
  PROJECT_ID: 'cal-itp-data-infra-staging'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/cal-bc:latest
            ghcr.io/${{ github.repository }}/cal-bc:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/cal-bc:latest
          cache-to: type=inline

      - name: Build and Push
        uses: docker/build-push-action@v6
        if: ${{ github.ref != 'refs/heads/main' }}
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}/cal-bc:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/cal-bc:latest
          cache-to: type=inline

  plan:
    name: Staging
    needs: [build]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Authenticate Google Service Account
        uses: google-github-actions/auth@v2
        with:
          create_credentials_file: true
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Setup GCloud utilities
        uses: google-github-actions/setup-gcloud@v2

      - name: Terraform Apply Cloud Run
        uses: dflook/terraform-apply@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path: iac/
          auto_approve: true
          variables: |
            image_tag = "${{ github.ref == 'refs/heads/main' && github.sha || github.event.pull_request.head.sha }}"

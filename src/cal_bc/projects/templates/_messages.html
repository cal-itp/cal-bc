{% load svg %}
<aside class="absolute right-0 z-110">
    {% for message in messages %}
    <div hx-on="load delay:5s -> this.remove();" class="rounded-md shadow-md border-l-4 border-success-700 bg-white p-4 sm:w-md md:w-xl">
        <div class="flex items-center">
            <div class="shrink-0">
                {% svg "projects/alerts/check" class="size-8 text-success-700" %}
            </div>
            <div class="ml-3">
                <p class="font-medium text-gray-900">{{ message }}</p>
            </div>
            <div class="ml-auto pl-3">
                <div class="-mx-1.5 -my-1.5">
                    <button type="button" hx-on="click -> this.parentElement.parentElement.parentElement.parentElement.remove();" class="cursor-pointer inline-flex rounded-md bg-white p-1.5 text-dds-teal-900 hover:shadow-(--button-hover) focus:outline-2 focus:outline-dds-teal-400 focus:ring-offset-0 focus:ring-dds-teal-400 focus-visible:outline-dds-teal-400">
                        <span class="sr-only">Dismiss</span>
                        {% svg "projects/alerts/x" class="size-6 text-dds-teal-900" %}
                    </button>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</aside>

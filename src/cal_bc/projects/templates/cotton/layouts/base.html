{% load static tailwind_cli django_htmx %}
<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-100 dark:bg-dds-teal-950">
<head>
    <title>{% block title %}Cal-B/C{% endblock %}</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    {% tailwind_css %}
    {% htmx_script version=4 %}
    <link rel="icon" type="image/png" sizes="180x180" href="{% static 'shared/favicon.png' %}">
    <link rel="apple-touch-icon" href="{% static 'shared/favicon.png' %}">
</head>

<body class="h-full" hx-boost="true" hx-headers:inherited='{"x-csrftoken": "{{ csrf_token }}"}'>
    {{ slot }}
    <script defer src="{% static 'scripts/htmx-ext-ws.min.js' %}"></script>
    <script defer src="{% static 'django_cotton_ui/cotton-ui.min.js' %}"></script>
    <script async src="https://cdn.jsdelivr.net/npm/@tailwindplus/elements@1" type="module"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/focus@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>
</html>

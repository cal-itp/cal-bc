{% load svg %}

<c-layouts.list hx-ext="ws" hx-ws:connect="/ws{% url 'projects' %}?page={{ page_obj.number }}" hx-target="this" hx-swap="innerMorph">
    <c-slot name="navbar">
        <c-base.navbar>
            <c-slot name="messages">
                <c-base.messages :messages=messages/>
            </c-slot>
        </c-base.navbar>
    </c-slot>

    <c-slot name="header">
        <p class="uppercase text-base font-light text-pretty text-dds-teal-700">Welcome, {% if user.get_short_name != "" %}{{ user.get_short_name }}{% endif %}</p>
        <div class="sm:flex sm:items-center">
            <div class="sm:flex-auto space-y-2">
                <h1 class="mt-4 text-4xl font-bold tracking-tight text-dds-teal-950">My Cal B/C Projects</h1>
                <p class="text-base font-light text-pretty text-gray-700">{{ page_obj.paginator.count }} projects</p>
            </div>
            <div class="mt-4 sm:mt-0 sm:ml-16 sm:flex-none">
                <a href="{% url 'models' %}" class="flex items-center gap-2 rounded-md bg-dds-teal-600 pl-3 pr-4 py-3 text-lg font-semibold text-white shadow hover:shadow-(--button-hover) focus:outline-4 focus:outline-dds-teal-400 focus:ring-offset-0 focus:ring-dds-teal-400 focus-visible:outline-dds-teal-400">
                    {% svg 'projects/plus' %}<span>New project</span>
                </a>
            </div>
        </div>
    </c-slot>

    {% include "projects/_list.html" %}

    <c-slot name="footer">
        <c-base.footer/>
    </c-slot>
</c-layouts.list>

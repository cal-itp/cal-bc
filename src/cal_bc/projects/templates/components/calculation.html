<dl>
    <dt id="read-only-field-{{ field.pk }}-name" class="block text-lg font-medium text-gray-900 mb-2 {{ label_classes }}">{{ field.name }}</dt>
    <dd aria-labelledby="read-only-field-{{ field.pk }}-name" class="grid grid-cols-1 border border-gray-400 rounded-xs bg-gray-100 py-2 text-lg text-gray-900 w-full truncate flex-grow block px-4 outline-none {{input_classes}}">
        <c-calculation-value field=field calculation=calculation />
    </dd>
</dl>

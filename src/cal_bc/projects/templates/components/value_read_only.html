{% load humanize %}

<div id="field-{{ field.pk }}-value" class="block text-lg font-medium text-gray-900 mb-2 {{ label_classes }}">
    {{ field.name }}
</div>

<div class="flex items-baseline border border-gray-600 rounded-xs bg-gray-100 py-3 text-lg text-gray-900 focus-within:border-dds-teal-600 focus-within:outline-4 focus-within:outline-dds-teal-400">
    <div aria-labelledby="field-{{ field.pk }}-value" class="w-full truncate flex-grow block px-4 outline-none {{input_classes}}">
        {% if value.value %}
            {% if field.unit == '$' or field.unit == '$' %}
                ${{ value.value|floatformat:0|intcomma }}
            {% elif field.unit or field.unit %}
                {{ value.value }} {% firstof field.unit field.unit %}
            {% endif %}
        {% else %}
            &nbsp;
        {% endif %}
    </div>
</div>

{% load svg get_class %}

<div class="pt-6 md:pt-0">
    <aside class="border border-dds-teal-600 rounded-lg bg-dds-teal-100 shadow-sm md:mt-16">
        <section class="rounded-t-md text-white bg-dds-teal-600 px-7 py-3 flex items-center justify-between">
            <h3 class="text-lg uppercase font-bold">Guide</h3>
            <button type="button" hx-on:click="htmx.find('#guide').innerHTML = ''" class="cursor-pointer text-white focus:outline-1 hover:text-gray-300 focus:outline-2 focus:outline-dds-teal-400 focus:ring-offset-0 focus:ring-dds-teal-400 focus-visible:outline-dds-teal-4000">
                <span class="sr-only">Close</span>{% svg "projects/guides/x" class="size-6" %}
            </button>
        </section>
        <article class="prose py-6 px-8 max-h-80 md:max-h-180 overflow-y-scroll">
          {{target.guide|safe}}
        </article>
    </aside>
</div>

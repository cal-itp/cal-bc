{% load svg get_class %}

<aside class="border border-dds-teal-600 rounded-lg bg-dds-teal-100 shadow-sm">
    <section class="rounded-t-md text-white bg-dds-teal-600 px-7 py-3 flex items-center justify-between">
        <h3 class="text-lg uppercase font-bold">Guide</h3>
        {% if target|get_class == "Row" %}
        <button type="button" hx-on:click="htmx.find('#guide').innerHTML = ''" class="text-white focus:outline-1 focus:-outline-offset-4 focus:outline-dds-teal-400 focus-visible:outline-1 focus-visible:outline-dds-teal-400">
            <span class="sr-only">Close</span>{% svg "projects/close" %}
        </button>
        {% endif %}
    </section>
    <article class="prose py-6 px-8">
      {{target.guide|safe}}
    </article>
</aside>

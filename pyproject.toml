[project]
name = "cal-bc"
version = "0.1.0"
description = "The California Life-Cycle Benefit-Cost Analysis Tool (Cal-B/C) calculates its life-cycle costs and benefits, net present value, benefit/cost ratio, internal rate of return, payback period as well as annual benefits."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "channels-postgres[cryptography]>=1.1.4",
    "channels[daphne]>=4.3.2",
    "daphne>=4.2.3",
    "dj-svg>=0.3.1",
    "django>=6.0.7",
    "django-azure-auth>=2.4.0",
    "django-debug-toolbar>=6.3.0",
    "django-downloadview>=2.4.0",
    "django-environ>=0.12.0",
    "django-extra-views>=0.16.0",
    "django-htmx>=1.28.0",
    "django-nested-admin>=4.1.6",
    "django-prose-editor[sanitize]>=0.26.0",
    "django-taggit>=6.1.0",
    "django-tailwind-cli>=4.6.2",
    "django-tasks-db>=0.12.0",
    "django-widget-tweaks>=1.5.0",
    "google-auth>=2.41.1",
    "platformdirs>=4.4.0",
    "psycopg2-binary>=2.9.11",
    "psycopg[binary]>=3.3.4",
    "tqdm>=4.67.1",
    "typer>=0.19.2",
    "xlcalculator",
]

[project.scripts]
cal-bc = "cal_bc:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.sources]
xlcalculator = { git = "https://github.com/cal-itp/xlcalculator", branch = "mov/caltrans-calculations" }

[tool.ruff.lint]
ignore = ["RUF012"]
extend-select = [
    "DJ",       # flake8-django: Django-specific bugs
    "I",        # isort
    "UP",       # pyupgrade
]

[dependency-groups]
dev = [
    "django-extensions>=4.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.4.0",
    "pytest-django>=4.11.1",
    "pytest-playwright>=0.7.1",
    "pytest-recording>=0.13.4",
    "ruff>=0.13.2",
    "unbrowsed>=0.1.0a22",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "cal_bc.settings"
env_files = ".env"
addopts = "--screenshot only-on-failure --full-page-screenshot --video retain-on-failure --slowmo 100"
